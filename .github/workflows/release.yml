name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.blockExoticSubdeps=false
      - run: pnpm test
      - run: pnpm run build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Kontakt-Drop-*-portable.exe
